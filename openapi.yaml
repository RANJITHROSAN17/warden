openapi: 3.1.0
info:
  title: Warden API
  version: 0.1.0
  description: |
    Spend authority and proof receipts for AI agents. Every agent payment passes through
    `/purchases`: a mandate is checked, the basket is compared against the reason the agent gave
    for buying it, and the decision is signed into a receipt that can be verified later.

    This document is the input for SDK generation (APIMatic / OpenAPI Generator). The reference
    implementation is `src/warden/api.py`.
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:8000
    description: Local
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Mode and judge in use
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  paypal_mode: { type: string, enum: [sandbox, simulated] }
                  judge: { type: string }
                  signing: { type: string }
  /api/mandates:
    get:
      operationId: listMandates
      summary: List issued mandates
      responses:
        "200":
          description: Mandates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Mandate" }
    post:
      operationId: createMandate
      summary: Issue a bounded, expiring permission to spend
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MandateRequest" }
      responses:
        "200":
          description: The issued mandate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mandate" }
  /api/purchases:
    post:
      operationId: attemptPurchase
      summary: Attempt a purchase against a mandate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseRequest" }
      responses:
        "200":
          description: The decision, with its signed receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "404":
          description: Unknown mandate
  /api/purchases/plan:
    post:
      operationId: planAndAttemptPurchase
      summary: Let the agent plan the basket, then judge it like any other attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mandate_id, goal]
              properties:
                mandate_id: { type: string }
                goal: { type: string }
      responses:
        "200":
          description: Plan plus decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
  /api/decisions/{decision_id}/grant:
    post:
      operationId: grantDecision
      summary: Release exactly one held basket, bound to its fingerprint
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                issued_by: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: Grant issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  grant_id: { type: string }
                  rule_id: { type: string }
                  expires_at: { type: string }
  /api/decisions/{decision_id}/capture:
    post:
      operationId: captureDecision
      summary: Capture an authorized payment
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Capture result
          content:
            application/json:
              schema: { type: object }
  /api/decisions/{decision_id}:
    get:
      operationId: getReceipt
      summary: Full signed receipt for a decision
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "404":
          description: Unknown decision
  /api/decisions/{decision_id}/verify:
    get:
      operationId: verifyReceipt
      summary: Recompute the receipt signature
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  decision_id: { type: string }
  /api/ledger:
    get:
      operationId: getLedger
      summary: Ledger rows and outcome counts
      responses:
        "200":
          description: Ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/LedgerRow" }
                  counts:
                    type: object
                    properties:
                      allow: { type: integer }
                      hold: { type: integer }
                      deny: { type: integer }
components:
  schemas:
    MandateRequest:
      type: object
      required: [purpose, ceiling]
      properties:
        purpose: { type: string, example: "Q4 office restock" }
        ceiling: { type: number, example: 500 }
        currency: { type: string, default: USD }
        categories:
          type: array
          items: { type: string }
          example: [office_supplies]
        min_vendor_age_days: { type: integer, default: 30 }
        intent_threshold: { type: number, default: 0.55 }
        ttl_hours: { type: integer, default: 24 }
    Mandate:
      type: object
      properties:
        id: { type: string }
        purpose: { type: string }
        ceiling: { type: number }
        currency: { type: string }
        allowed_categories:
          type: array
          items: { type: string }
        min_vendor_age_days: { type: integer }
        intent_threshold: { type: number }
        expires_at: { type: string }
        issued_by: { type: string }
        fingerprint: { type: string }
    PurchaseRequest:
      type: object
      required: [mandate_id, vendor_id, items, stated_intent]
      properties:
        mandate_id: { type: string }
        vendor_id: { type: string }
        items:
          type: array
          items:
            type: object
            required: [sku]
            properties:
              sku: { type: string }
              qty: { type: integer, default: 1 }
        stated_intent:
          type: string
          description: The reason the agent gives for this purchase. Judged against the basket.
    RuleResult:
      type: object
      properties:
        rule_id: { type: string }
        passed: { type: boolean }
        detail: { type: string }
        counterfactual: { type: string, nullable: true }
    Decision:
      type: object
      properties:
        decision_id: { type: string }
        attempt_id: { type: string }
        outcome: { type: string, enum: [allow, hold, deny] }
        amount: { type: number }
        currency: { type: string }
        rules:
          type: array
          items: { $ref: "#/components/schemas/RuleResult" }
        intent:
          type: object
          properties:
            score: { type: number }
            evidence: { type: string }
            judge: { type: string }
        reasons:
          type: array
          items: { type: string }
        counterfactual: { type: string, nullable: true }
        mode: { type: string, enum: [sandbox, simulated] }
        paypal: { type: object }
        receipt: { $ref: "#/components/schemas/Receipt" }
    Receipt:
      type: object
      properties:
        alg: { type: string, example: HMAC-SHA256 }
        key_id: { type: string }
        payload: { type: object }
        sig: { type: string }
    LedgerRow:
      type: object
      properties:
        id: { type: string }
        at: { type: string }
        outcome: { type: string }
        amount: { type: number }
        currency: { type: string }
        vendor: { type: string }
        mandate_id: { type: string }
        mode: { type: string }
        intent_score: { type: number }
        reason: { type: string }
        counterfactual: { type: string, nullable: true }
        paypal_id: { type: string }
