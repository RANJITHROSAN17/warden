[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grace"
version = "0.1.0"
description = "Character, not ceilings: an agent payment judged against the business that made it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ranjith Rosan" }]
keywords = [
    "payments",
    "paypal",
    "agentic-commerce",
    "risk",
    "escrow",
    "disputes",
    "ai-agents",
]

dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
grace = "grace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
